<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DallahMoon | $DALLAH - To The Moon ☕🌙</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #000000 0%, #0d1b2a 50%, #1b263b 100%);
      color: white;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      font-family: 'Cairo', sans-serif;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(2deg); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.5); }
      50% { box-shadow: 0 0 60px rgba(255,215,0,0.9); }
    }

    .logo {
      animation: float 6s ease-in-out infinite, glow 3s ease-in-out infinite;
      border-radius: 24px;
    }

    .countdown-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin: 2.5rem 0;
    }

    .countdown-box {
      background: rgba(255, 215, 0, 0.12);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 215, 0, 0.5);
      border-radius: 16px;
      padding: 1.3rem 2rem;
      min-width: 120px;
      text-align: center;
      transition: all 0.4s ease;
      box-shadow: 0 8px 25px rgba(0,0,0,0.45);
    }

    .countdown-box:hover {
      transform: translateY(-10px);
      border-color: #ffd700;
      box-shadow: 0 15px 45px rgba(255,215,0,0.4);
    }

    .countdown-number {
      font-size: 3rem;
      font-weight: 900;
      color: #ffd700;
      line-height: 1;
      text-shadow: 0 0 15px rgba(255,215,0,0.8);
    }

    .countdown-label {
      font-size: 1.1rem;
      color: #e0e0e0;
      margin-top: 0.5rem;
      font-weight: 500;
    }

    .join-btn {
      background: #ffd700;
      color: black;
      font-weight: bold;
      padding: 1.2rem 3.2rem;
      border-radius: 9999px;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(255,215,0,0.5);
      font-size: 1.4rem;
    }

    .join-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 50px rgba(255,215,0,0.7);
      background: white;
    }

    @media (max-width: 640px) {
      .countdown-number { font-size: 2.3rem; }
      .countdown-box { min-width: 100px; padding: 1rem 1.4rem; }
      .join-btn { font-size: 1.2rem; padding: 1rem 2.5rem; }
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- Hero Section with Countdown at the top -->
  <header class="relative px-6 py-16 md:py-32 text-center">
    <div class="max-w-6xl mx-auto">
      <img 
        src="https://files.catbox.moe/28uih2.png" 
        alt="DallahMoon Logo" 
        class="logo w-full max-w-xs md:max-w-lg mx-auto mb-10"
      >
      
      <h1 class="text-5xl md:text-7xl lg:text-8xl font-black mb-6" style="color:#ffd700; text-shadow: 0 0 40px #ffd700;">
        DallahMoon ☕🌙
      </h1>
      
      <p class="text-xl md:text-3xl max-w-4xl mx-auto mb-10 leading-relaxed">
        The First Arabic Cultural Meme Coin – Brewed with Hospitality... To The Moon! 🚀
      </p>

      <!-- Beautiful Countdown Timer -->
      <div class="countdown-container" id="countdown">
        <div class="countdown-box">
          <div class="countdown-number" id="days">00</div>
          <div class="countdown-label">Days</div>
        </div>
        <div class="countdown-box">
          <div class="countdown-number" id="hours">00</div>
          <div class="countdown-label">Hours</div>
        </div>
        <div class="countdown-box">
          <div class="countdown-number" id="minutes">00</div>
          <div class="countdown-label">Minutes</div>
        </div>
        <div class="countdown-box">
          <div class="countdown-number" id="seconds">00</div>
          <div class="countdown-label">Seconds</div>
        </div>
      </div>

      <!-- Call to Action Buttons -->
      <div class="flex flex-wrap justify-center gap-6 mt-12">
        <a href="https://t.me/DallahMoon" target="_blank" class="inline-block">
          <button class="join-btn">
            Join Telegram Now 🚀
          </button>
        </a>
        
        <a href="https://www.pinksale.finance/launchpad/polygon/0x2F15Aa40aaF7517F4380b6f9d0aFce6BAd6F8705" target="_blank" class="inline-block">
          <button class="join-btn">
            Join Presale Now ☕
          </button>
        </a>
      </div>
    </div>
  </header>

  <!-- You can add the rest of your sections here (About, Tokenomics, Roadmap, etc.) -->

  <script>
    // Presale start date: January 17, 2026
    const countDownDate = new Date("Jan 17, 2026 00:00:00 GMT+0300").getTime();

    const countdownFunction = setInterval(() => {
      const now = new Date().getTime();
      const distance = countDownDate - now;

      if (distance < 0) {
        clearInterval(countdownFunction);
        document.getElementById("countdown").innerHTML = 
          '<div class="text-4xl md:text-5xl font-bold text-yellow-400 mt-10">PRESALE IS LIVE NOW! 🚀</div>';
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").textContent = days.toString().padStart(2, '0');
      document.getElementById("hours").textContent = hours.toString().padStart(2, '0');
      document.getElementById("minutes").textContent = minutes.toString().padStart(2, '0');
      document.getElementById("seconds").textContent = seconds.toString().padStart(2, '0');
    }, 1000);
  </script>

</body>
           </html>
