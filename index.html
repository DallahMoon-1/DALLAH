<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DallahMoon | $DALLAH - To The Moon ☕🌙</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  margin:0;
  font-family:'Tajawal',Arial,sans-serif;
  background:linear-gradient(135deg,#000 0%,#0d1b2a 50%,#1b263b 100%);
  color:#fff;
  text-align:center;
}
h1,h2,h3 {font-family:'Cairo',sans-serif}
.logo {animation: float 6s ease-in-out infinite;}
@keyframes float {
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-15px)}
}
.card {
  background:rgba(255,215,0,.08);
  border:2px solid rgba(255,215,0,.4);
  border-radius:16px;
}
.join-btn {
  background:#ffd700;
  color:#000;
  padding:18px 40px;
  font-weight:bold;
  border-radius:999px;
}
</style>
</head>

<body>

<header class="py-24 px-5">
  <img src="https://files.catbox.moe/28uih2.png" class="logo mx-auto mb-8 max-w-md">
  <h1 class="text-6xl font-black mb-6 text-yellow-400">DallahMoon ☕🌙</h1>
  <p class="text-xl max-w-3xl mx-auto mb-10">
    The First Arabic Cultural Meme Coin – Brewed with Hospitality... To The Moon! 🚀
  </p>

  <!-- COUNTDOWN -->
  <div class="mb-12">
    <h3 class="text-2xl font-bold text-yellow-400 mb-4">Presale starts in</h3>
    <div id="countdown" class="flex justify-center gap-4">
      <div class="card px-6 py-4">
        <div id="days" class="text-3xl font-black text-yellow-400">0</div>
        <div>Days</div>
      </div>
      <div class="card px-6 py-4">
        <div id="hours" class="text-3xl font-black text-yellow-400">0</div>
        <div>Hours</div>
      </div>
      <div class="card px-6 py-4">
        <div id="minutes" class="text-3xl font-black text-yellow-400">0</div>
        <div>Minutes</div>
      </div>
      <div class="card px-6 py-4">
        <div id="seconds" class="text-3xl font-black text-yellow-400">0</div>
        <div>Seconds</div>
      </div>
    </div>
  </div>

  <a href="https://t.me/DallahMoon" target="_blank">
    <button class="join-btn">Join Telegram 🚀</button>
  </a>
</header>

<footer class="py-10">
  © 2026 DallahMoon — To The Moon ☕🌙
</footer>

<script>
const presaleDate = new Date("January 17, 2026 00:00:00 UTC").getTime();

function updateCountdown() {
  const now = new Date().getTime();
  const distance = presaleDate - now;

  if (distance <= 0) {
    document.getElementById("countdown").innerHTML =
      "<span class='text-2xl font-bold text-green-400'>Presale is LIVE 🚀</span>";
    return;
  }

  document.getElementById("days").innerText =
    Math.floor(distance / (1000 * 60 * 60 * 24));
  document.getElementById("hours").innerText =
    Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  document.getElementById("minutes").innerText =
    Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  document.getElementById("seconds").innerText =
    Math.floor((distance % (1000 * 60)) / 1000);
}

setInterval(updateCountdown, 1000);
updateCountdown();
</script>

</body>
    </html>
